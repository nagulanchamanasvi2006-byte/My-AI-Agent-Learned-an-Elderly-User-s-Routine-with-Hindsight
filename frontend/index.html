<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Agent Learned an Elderly User’s Routine with Hindsight</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: #2c6e91;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 16px;
        }

        .chat-box {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.5;
        }

        .user {
            background: #d9edf7;
            margin-left: auto;
            text-align: right;
        }

        .ai {
            background: #eeeeee;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 14px 22px;
            border: none;
            border-radius: 8px;
            background: #2c6e91;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            font-size: 13px;
            color: #666;
            padding-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>My AI Agent Learned an Elderly User’s Routine with Hindsight</h1>
        <p>Your friendly personal-care assistant</p>
    </div>

    <div class="chat-box" id="chatBox">

        <div class="message ai">
            👋 Hello! I am your Elderly AI Companion.
            <br><br>
            You can ask me about your food preferences, routines,
            medicines, or reminders.
        </div>

    </div>

    <div class="status" id="status"></div>

    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Type your message..."
            onkeydown="handleKey(event)"
        >

        <button id="sendButton" onclick="sendMessage()">
            Send
        </button>

    </div>

</div>


<script>

    const API_URL = "http://127.0.0.1:8000/chat";

    function handleKey(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    }


    function addMessage(message, type) {

        const chatBox = document.getElementById("chatBox");

        const messageDiv = document.createElement("div");

        messageDiv.className = "message " + type;

        messageDiv.innerText = message;

        chatBox.appendChild(messageDiv);

        chatBox.scrollTop = chatBox.scrollHeight;

    }


    async function sendMessage() {

        const input = document.getElementById("messageInput");

        const sendButton = document.getElementById("sendButton");

        const status = document.getElementById("status");

        const message = input.value.trim();

        if (message === "") {
            return;
        }


        // Show user's message

        addMessage(message, "user");

        input.value = "";

        sendButton.disabled = true;

        status.innerText = "AI is thinking...";


        try {

            const response = await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message
                })

            });


            if (!response.ok) {

                throw new Error("Server error: " + response.status);

            }


            const data = await response.json();


            // Show AI response

            addMessage(data.agent_response, "ai");


        } catch (error) {

            console.error(error);

            addMessage(
                "Sorry, I could not connect to the AI server. Please make sure the backend is running.",
                "ai"
            );

        }


        status.innerText = "";

        sendButton.disabled = false;

        input.focus();

    }

</script>

</body>
</html>
